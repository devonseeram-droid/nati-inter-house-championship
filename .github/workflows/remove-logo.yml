name: Remove NATI logo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-logo.yml'
permissions:
  contents: write
jobs:
  remove-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove logo markup and styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          s=re.sub(r'<img class="logo-img"[^>]*>','',s)
          s=re.sub(r'\.logo-img\{[^}]*\}','',s)
          s=re.sub(r'\.logo-img\{[^}]*\}','',s)
          p.write_text(s)
          PY
      - name: Commit removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove NATI logo from website'
          git push
